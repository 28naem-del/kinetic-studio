[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-studio"
version = "0.1.0"
description = "Programmatic motion-graphics video engine: beat-synced kinetic type, explainers, product promos, data stories and karaoke clips from a JSON spec."
readme = "README.md"
authors = [{ name = "Naem / Aristotle Intelligence" }]
keywords = ["video", "motion-graphics", "reels", "kinetic-typography", "agent-skill", "ffmpeg"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["skia-python>=87.5", "numpy>=1.24", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "pre-commit>=3"]

[project.urls]
Homepage = "https://github.com/28naem-del/kinetic-studio"
Issues = "https://github.com/28naem-del/kinetic-studio/issues"

[project.scripts]
kstudio = "kstudio.cli:main"

[tool.setuptools.packages.find]
include = ["kstudio*"]

[tool.setuptools.package-data]
kstudio = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "E731", "E702", "E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# `once(key, factory)` calls the factory immediately (memoised synth), so late binding cannot occur.
"kstudio/audio/music.py" = ["B023"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
files = ["kstudio"]
