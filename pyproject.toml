[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-studio"
dynamic = ["version"]
description = "Programmatic motion-graphics video engine: beat-synced kinetic type, explainers, product promos, data stories and karaoke clips from a JSON spec."
readme = "README.md"
authors = [{ name = "Naem / Aristotle Intelligence" }]
keywords = ["video", "motion-graphics", "reels", "kinetic-typography", "agent-skill", "ffmpeg"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["skia-python>=87.5", "numpy>=1.24", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
# The MCP server (kstudio-mcp) speaks the protocol with the standard library only; the extra exists so
# `pip install "kinetic-studio[mcp]"` / `uv tool install "kinetic-studio[mcp]"` stay stable install lines.
mcp = []
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "pre-commit>=3", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/28naem-del/kinetic-studio"
Issues = "https://github.com/28naem-del/kinetic-studio/issues"

[project.scripts]
kinetic-studio = "kstudio.cli:main"
kstudio = "kstudio.cli:main"
kstudio-mcp = "kstudio.mcp_server:main"

[tool.setuptools]
# Include the upstream workflow MIT notice in wheels as well as source distributions.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
packages = ["kstudio", "kstudio.audio", "kstudio.scenes", "kstudio.examples"]
include-package-data = false

[tool.setuptools.package-dir]
# The example projects ship inside the wheel as kstudio/examples (found by kstudio.spec.examples_dir()).
"kstudio.examples" = "examples"

[tool.setuptools.dynamic]
version = { attr = "kstudio.__version__" }

[tool.setuptools.package-data]
kstudio = ["assets/fonts/*", "workflows/*.json", "workflows/*.md"]
"kstudio.examples" = ["*/*.json", "*/*.jsonc", "*/*.js", "*/*.mjs", "*/*.png", "*/*.jpg", "*/*.svg",
                      "*/*.wav", "*/*.mp3", "*/*.mp4", "*/*.sh", "*/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "E731", "E702", "E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# `once(key, factory)` calls the factory immediately (memoised synth), so late binding cannot occur.
"kstudio/audio/music.py" = ["B023"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
files = ["kstudio"]
